[package]
name = "ride-route"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPX / bikerouter import, route processing (resample, smooth, grade, climbs) and local persistence"

[dependencies]
ride-model = { workspace = true }
# The ride log stores the segment (climb) times of a finished ride: the same computation the
# engine uses live, so a stored time and the on-screen PR always agree.
ride-sim = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
tokio = { workspace = true }
quick-xml = "0.42"
# Backup / restore (`backup.rs`): one .zip of the data folder. Deflate through flate2 (already in the
# tree), none of the default features (encryption, bzip2, zstd, lzma ... pull C libraries).
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Public services (BRouter, Open-Meteo). rustls only, no native-tls / OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# Android: `reqwest`'s `rustls` feature verifies certificates with `rustls-platform-verifier`,
# whose Android backend calls a Kotlin class that has to be compiled into the APK - and panics
# with "Expect rustls-platform-verifier to be initialized" when it was not. `dx` only generates
# `MainActivity.kt`, so the Android build verifies against the Mozilla roots compiled into the
# binary instead (the same set the desktop builds already trust); see `http::client_builder`.
[target.'cfg(target_os = "android")'.dependencies]
rustls = "0.23"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
