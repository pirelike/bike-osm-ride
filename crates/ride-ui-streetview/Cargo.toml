[package]
name = "ride-ui-streetview"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Google Street View panel (own API key): metadata lookups, panorama-id cache, planner, prefetcher and the double-buffered embed panel"

[dependencies]
ride-model = { workspace = true }
ride-route = { workspace = true }
ride-ui-kit = { workspace = true }
dioxus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# Same stack as ride-route: rustls only, no native-tls / OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
dioxus-ssr = "0.7"
tempfile = "3"
