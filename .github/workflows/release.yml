# Builds the Windows executable and the Android APK for a version tag (`v0.2.0`) and publishes
# them as a GitHub release. The asset names are what the in-app updater looks for
# (`crates/ride-app/src/updater.rs`): `*-windows-x64.exe` and `*.apk`.
#
# Android signing: an APK can only be updated in place by one signed with the same key. Put a
# keystore into the repository secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS); without them the APK is signed with the throw-away debug key of the runner.
name: release

# Started by hand for now (Actions -> release -> Run workflow, on a version tag); switch to
# `push: tags: ["v*"]` once a run has been checked end to end.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # MSVC links WebView2Loader statically: the exe runs without a DLL beside it.
      - run: cargo build --release -p ride-app
      - name: Name the asset
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp target/release/bike-osm-ride.exe "dist/bike-osm-ride-${version}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Android NDK
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@0.7.10 || cargo install dioxus-cli@0.7.10 --locked
      - name: Bundle the APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        working-directory: crates/ride-app
        run: dx bundle --platform android --package-types apk --release --target aarch64-linux-android
      - name: Sign and name the asset
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="$(find target/dx -name '*.apk' -path '*outputs*' | head -n 1)"
          test -n "$apk"
          mkdir dist
          out="dist/bike-osm-ride-${version}-android.apk"
          if [ -n "$KEYSTORE_B64" ]; then
            tools="$ANDROID_HOME/build-tools/34.0.0"
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            "$tools/zipalign" -f -p 4 "$apk" aligned.apk
            "$tools/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --out "$out" aligned.apk
            rm release.jks
          else
            cp "$apk" "$out"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
