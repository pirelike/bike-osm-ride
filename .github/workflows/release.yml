# Builds every package of a version tag (`v0.2.0`) and publishes them as a GitHub release.
#
# Asset contract — the in-app updater (`crates/ride-app/src/updater.rs`) looks for exactly these
# names, so renaming one here means changing `Platform::matches` and the README too:
#
#   bike-osm-ride-<ver>-windows-x64.exe        self-replacing update (MZ check)
#   bike-osm-ride-<ver>-android.apk            opened in the browser, installed by the system
#   bike-osm-ride-<ver>-linux-x86_64.AppImage  self-replacing update inside an AppImage
#   bike-osm-ride-<ver>-linux-amd64.deb        release page (the package manager owns /usr)
#   bike-osm-ride-<ver>-macos-universal.dmg    release page (ad-hoc signed, not notarised)
#
# Android signing: an APK can only be updated in place by one signed with the same key. Put a
# keystore into the repository secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS); without them the APK is signed with the throw-away debug key of the runner.
#
# Linux is built on Ubuntu 22.04 (glibc 2.35) so both the AppImage and the .deb still start on
# older distributions. macOS is built on one Apple Silicon runner that cross-compiles the Intel
# half and `lipo`s the two into a single universal binary (GitHub no longer offers macos-13).
name: release

# Started by hand for now (Actions -> release -> Run workflow, on a version tag); switch to
# `push: tags: ["v*"]` once a run has been checked end to end.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      # One red platform must not hide the other two.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # wry/WebKitGTK needs the dev packages at build time; btleplug's BlueZ backend needs
      # libdbus (the `dbus` crate of `wake.rs` compiles against it as well).
      - name: Build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # MSVC links WebView2Loader statically and crt-static the C runtime: the exe needs neither
      # a DLL beside it nor the Visual C++ redistributable.
      - run: cargo build --release -p ride-app
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Name the asset
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp target/release/bike-osm-ride.exe "dist/bike-osm-ride-${version}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # only platform-tools: the action's default list still has the long-gone "tools" package,
      # which makes sdkmanager fail
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android NDK
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@0.7.10 || cargo install dioxus-cli@0.7.10 --locked
      - name: Bundle the APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        working-directory: crates/ride-app
        run: dx bundle --platform android --package-types apk --release --target aarch64-linux-android
      - name: Sign and name the asset
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="$(find target/dx -name '*.apk' -path '*outputs*' | head -n 1)"
          test -n "$apk"
          mkdir dist
          out="dist/bike-osm-ride-${version}-android.apk"
          if [ -n "$KEYSTORE_B64" ]; then
            tools="$ANDROID_HOME/build-tools/34.0.0"
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            "$tools/zipalign" -f -p 4 "$apk" aligned.apk
            "$tools/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --out "$out" aligned.apk
            rm release.jks
          else
            cp "$apk" "$out"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies (WebKitGTK, GTK 3, Xdo, BlueZ) and the smoke-test display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libdbus-1-dev pkg-config \
            xvfb libfuse2 file
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@0.7.10 || cargo install dioxus-cli@0.7.10 --locked
      # A plain cargo build first: the binary the smoke test runs is then exactly the one the
      # bundler packages, and a compile error is not hidden behind the bundler.
      - name: Build the binary
        run: cargo build --release -p ride-app
      - name: Smoke test (the demo ride must stay alive for 20 s)
        run: |
          set +e
          xvfb-run -a timeout 20 env \
            RIDE_DEMO=1 \
            WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            ./target/release/bike-osm-ride
          code=$?
          set -e
          # 124 is what `timeout` returns when the process was still running: nothing crashed.
          if [ "$code" -ne 124 ]; then
            echo "the app exited on its own with code $code (expected 124 = still running)" >&2
            exit 1
          fi
      - name: Bundle the AppImage and the .deb
        id: bundle
        continue-on-error: true
        working-directory: crates/ride-app
        run: dx bundle --platform linux --package-types appimage --package-types deb --release
      - name: Fallback packaging when the Linux bundler fails
        if: steps.bundle.outcome == 'failure'
        run: bash packaging/linux/fallback.sh "${GITHUB_REF_NAME#v}" dist
      - name: Name the assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          if [ -d target/dx ]; then
            appimage="$(find target/dx -name '*.AppImage' | head -n 1 || true)"
            deb="$(find target/dx -name '*.deb' | head -n 1 || true)"
            if [ -n "$appimage" ]; then
              cp "$appimage" "dist/bike-osm-ride-${version}-linux-x86_64.AppImage"
            fi
            if [ -n "$deb" ]; then
              cp "$deb" "dist/bike-osm-ride-${version}-linux-amd64.deb"
            fi
          fi
          ls -l dist
          test -f "dist/bike-osm-ride-${version}-linux-x86_64.AppImage"
          test -f "dist/bike-osm-ride-${version}-linux-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/bike-osm-ride-*-linux-x86_64.AppImage
            dist/bike-osm-ride-*-linux-amd64.deb

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The runner is arm64; the Intel half is cross-compiled and `lipo`ed in.
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Universal .app and .dmg
        run: bash packaging/macos/bundle.sh "${GITHUB_REF_NAME#v}" dist
      # Without the usage description macOS kills the app the moment it touches CoreBluetooth.
      - name: The Bluetooth permission must be in the bundle
        run: |
          plist="dist/bike-osm-ride.app/Contents/Info.plist"
          plutil -lint "$plist"
          plutil -extract NSBluetoothAlwaysUsageDescription raw "$plist" | grep -q .
          test "$(lipo -archs dist/bike-osm-ride.app/Contents/MacOS/bike-osm-ride)" = "x86_64 arm64"
      - name: Name the asset
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/out
          mv "dist/bike-osm-ride-${version}-macos-universal.dmg" dist/out/
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/out/*

  release:
    needs: [test, windows, android, linux, macos]
    # a release needs a version tag (a run on a branch only builds the artifacts)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
